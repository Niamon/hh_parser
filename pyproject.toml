[project]
name = "hhparser"
version = "1"
dependencies = [
    "beautifulsoup4==4.14.2",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "contourpy==1.3.0",
    "cycler==0.12.1",
    "fonttools==4.60.1",
    "greenlet==3.2.4",
    "idna==3.11",
    "importlib_resources==6.5.2",
    "kiwisolver==1.4.7",
    "lxml==6.0.2",
    "matplotlib==3.9.4",
    "numpy==2.0.2",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "psycopg2-binary==2.9.11",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.1",
    "pytz==2025.2",
    "requests==2.32.5",
    "seaborn==0.13.2",
    "SQLAlchemy==2.0.44",
    "typing_extensions==4.15.0",
    "tzdata==2025.2",
    "urllib3==2.5.0",
    "zipp==3.23.0"
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project.scripts]
hhparser = "main:main"
[tool.setuptools]
package-dir = {"" = "src"}